# Dependabot version updates.
#
# Security updates are a separate, always-on mechanism and do not depend on this
# file. What this configures is the routine "a new version is out" traffic, which
# is what kept the GitHub Actions here a major version behind.
#
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Maven dependencies and build plugins
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Test-only dependencies. Low risk, high churn — one PR is plenty.
      testing:
        patterns:
          - "org.junit*"
          - "org.assertj*"
        update-types:
          - "minor"
          - "patch"
      # Build plugins. A broken plugin bump fails CI loudly, so batching is safe.
      build-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.jacoco:*"
          - "org.sonarsource.scanner.maven:*"
          - "com.diffplug.spotless:*"
          - "com.mycila:*"
        exclude-patterns:
          # The GPG plugin signs release artifacts. A surprise here breaks
          # publishing to Maven Central, so it gets its own reviewable PR.
          - "org.apache.maven.plugins:maven-gpg-plugin"
        update-types:
          - "minor"
          - "patch"
      # Publishing to Maven Central. Kept out of the plugin batch for the same
      # reason as the GPG plugin: it is the release path.
      publishing:
        patterns:
          - "org.sonatype.central:*"
        update-types:
          - "minor"
          - "patch"
    # Major bumps are deliberately left ungrouped: commons-lang3 is the only
    # dependency that reaches consumers, and a JUnit or plugin major deserves
    # its own diff rather than riding along in a batch.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
